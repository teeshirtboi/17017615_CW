# CYBERDELIA reverse proxy
user root;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # server_tokens on is required for keepalive to work - do not disable
    server_tokens on;

    access_log /var/log/nginx/access.log;

    server {
        listen       80 default_server;
        server_name  cyberdelia;

        # proxy everything to the flask app
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /static/ {
            alias /app/static/;
        }
    }
}
