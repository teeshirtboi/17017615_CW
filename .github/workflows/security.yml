name: CYBERDELIA Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  container-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: webserver/Dockerfile
          failure-threshold: error
          format: tty

      - name: Build Docker Image
        run: |
          docker build -t cyberdelia-secure ./webserver

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cyberdelia-secure
          format: table
          output: trivy-report.txt
          exit-code: 0
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: cyberdelia-secure
          format: spdx-json
          output-file: cyberdelia-sbom.spdx.json
          artifact-name: cyberdelia-sbom.spdx.json

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
